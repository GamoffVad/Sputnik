name: Windows — build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      publish:
        description: Publish the installer and portable build as a GitHub release
        default: true
        type: boolean
      source_ref:
        description: Optional source tag or commit to rebuild
        default: ''
        type: string
      include_pets:
        description: Rebuild pet packages (normally distributed in the separate pet library release)
        default: false
        type: boolean

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build distribution and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Expected a version such as 1.2.0 or 1.3.28.28.' }
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup checksum mismatch.' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno7'
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $compilerDir + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found.' }
          $payload = Join-Path $PWD 'artifacts/payload'
          $out = Join-Path $PWD 'artifacts/release'
          dotnet publish Sputnik.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -o $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $out | Out-Null
          & ./installer/Prepare-Payload.ps1 -PublishDir $payload
          & ./installer/Test-Payload.ps1 -PublishDir $payload -Version $env:APP_VERSION -Target modern-x64
          $eagle = Join-Path $env:RUNNER_TEMP 'military-eagle.pet'
          Invoke-WebRequest 'https://github.com/GamoffVad/Sputnik/releases/download/pet-military-eagle-v2/military-eagle.pet' -OutFile $eagle
          if ((Get-FileHash $eagle).Hash.ToLowerInvariant() -ne '583a34b028323cf7cb84ca38d73432e18939431277cf7b933d63dd321e4fe7e7') { throw 'Eagle package checksum mismatch.' }
          dotnet run --project tests/eagle-check/Check.csproj -c Release "-p:SputnikDirectory=$payload" -- $payload $eagle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($check in @('notification-check','memory-check','pet-removal-check','application-icons-check')) {
            dotnet run --project "tests/$check/Check.csproj" -c Release "-p:SputnikDirectory=$payload" -- "artifacts/qa/$check-modern"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Compress-Archive -Path "$payload/*" -DestinationPath "$out/Sputnik-$env:APP_VERSION-Windows-10-11-x64-Portable.zip"
          & $compiler "/DAppVersion=$env:APP_VERSION" "/DVersionedOutput" "/DPublishDir=$payload" "/DInstallerOutput=$out" installer/Sputnik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -LiteralPath "$out/SputnikSetup-$env:APP_VERSION-win10-win11-x64.exe" -Destination "$out/Sputnik-$env:APP_VERSION-Windows-10-11-x64.exe"
      - name: Build Windows 7 installers and checksums
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          INCLUDE_PETS: ${{ inputs.include_pets }}
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'inno7/ISCC.exe'
          & ./installer/Build-Windows7.ps1 -Version $env:APP_VERSION -Compiler $compiler
          foreach ($arch in @('x64','x86')) {
            Copy-Item "artifacts/win7/v$env:APP_VERSION/SputnikSetup-$env:APP_VERSION-win7-$arch.exe" "artifacts/release/Sputnik-$env:APP_VERSION-Windows-7-$arch.exe"
            $legacyPayload = Join-Path $PWD "artifacts/win7/payload-$env:APP_VERSION-$arch"
            foreach ($check in @('notification-check','memory-check','pet-removal-check','application-icons-check')) {
              $intermediate = Join-Path $PWD "artifacts/qa/obj-$check-$arch/"
              dotnet run --project "tests/$check/Check.csproj" -c Release -p:Win7=true "-p:PlatformTarget=$arch" "-p:SputnikDirectory=$legacyPayload" "-p:BaseIntermediateOutputPath=$intermediate" -- "artifacts/qa/$check-$arch"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          $source = "artifacts/release/Sputnik-$env:APP_VERSION-Windows-source.zip"
          git archive --format=zip -o $source HEAD -- ':(top,glob)*.cs' ':(top,glob)*.xaml' Sputnik.csproj Sputnik.ico Components wwwroot/assets/klyaksa wwwroot/assets/pets.json wwwroot/assets/icon-catalog.json wwwroot/assets/LUCIDE-LICENSE.txt installer tests/notification-check tests/memory-check tests/pet-removal-check tests/application-icons-check tests/eagle-check "docs/releases/$env:APP_VERSION.md" docs/fixes/windows-memory.md README.md .gitignore .gitattributes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:INCLUDE_PETS -eq 'true') { & ./installer/Build-Pet-Packages.ps1 -OutputDir artifacts/release }
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8
      - name: Upload preview installer and portable build
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-Windows-${{ inputs.version }}-preview
          path: |
            artifacts/release/Sputnik-*.exe
            artifacts/release/Sputnik-*-Portable.zip
            artifacts/release/Sputnik-*-Windows-source.zip
            artifacts/release/*.pet
            artifacts/release/pets.json
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Publish release
        if: inputs.publish
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $repo = $env:GITHUB_REPOSITORY
          $sourceCommit = git rev-parse HEAD
          $existing = gh release view $tag --repo $repo --json isDraft 2>$null
          $resume = $LASTEXITCODE -eq 0
          if ($resume) {
            if (!($existing | ConvertFrom-Json).isDraft) { throw "Release $tag is already published; use a new version." }
            git fetch --depth=1 origin "refs/tags/$tag`:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify draft tag.' }
            $tagCommit = git rev-parse "$tag^{commit}"
            if ($tagCommit -ne $sourceCommit) { throw 'Draft tag does not match the checked-out source.' }
          }
          $notes = "docs/releases/$env:APP_VERSION.md"
          if (!$resume) {
            if (Test-Path -LiteralPath $notes) {
              gh release create $tag --repo $repo --target $sourceCommit --title "Спутник $env:APP_VERSION — Windows" --notes-file $notes --draft
            } else {
              gh release create $tag --repo $repo --target $sourceCommit --title "Спутник $env:APP_VERSION — Windows" --generate-notes --draft
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release upload $tag @files --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = (gh api "repos/$repo/releases" | ConvertFrom-Json) | Where-Object tag_name -EQ $tag | Select-Object -First 1
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $asset = $release.assets | Where-Object name -EQ $name
            $digest = 'sha256:' + (Get-FileHash $file).Hash.ToLowerInvariant()
            if (!$asset -or $asset.state -ne 'uploaded' -or $asset.digest -ne $digest) { throw "Uploaded checksum mismatch: $name" }
          }
          gh release edit $tag --draft=false --latest --repo $repo
          exit $LASTEXITCODE
