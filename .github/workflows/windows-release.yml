name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      publish:
        description: Publish the installer and portable build as a GitHub release
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build distribution and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a version such as 1.2.0.' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe","$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found.' }
          $payload = Join-Path $PWD 'artifacts/payload'
          $out = Join-Path $PWD 'artifacts/release'
          dotnet publish Sputnik.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -o $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $out | Out-Null
          & ./installer/Prepare-Payload.ps1 -PublishDir $payload
          Compress-Archive -Path "$payload/*" -DestinationPath "$out/Sputnik-win-x64.zip"
          & $compiler.FullName "/DAppVersion=$env:APP_VERSION" "/DVersionedOutput" "/DPublishDir=$payload" "/DInstallerOutput=$out" installer/Sputnik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath "$out/SputnikSetup-$env:APP_VERSION-win10-win11-x64.exe"
      - name: Build Windows 7 installers and checksums
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe","$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found.' }
          & ./installer/Build-Windows7.ps1 -Version $env:APP_VERSION -Compiler $compiler.FullName
          Copy-Item "artifacts/win7/v$env:APP_VERSION/*.exe" artifacts/release/
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8
      - name: Upload preview installer and portable build
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-Windows-${{ inputs.version }}-preview
          path: |
            artifacts/release/SputnikSetup-*.exe
            artifacts/release/Sputnik-win-x64.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Publish release
        if: inputs.publish
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; use a new version." }
          $notes = "docs/releases/$env:APP_VERSION.md"
          if (Test-Path -LiteralPath $notes) {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Спутник $tag" --notes-file $notes --draft
          } else {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Спутник $tag" --generate-notes --draft
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release upload $tag @files --repo $repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest --repo $repo
          exit $LASTEXITCODE
