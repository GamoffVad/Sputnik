name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      publish:
        description: Publish the installer and portable build as a GitHub release
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build distribution and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a version such as 1.2.0.' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe","$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found.' }
          $payload = Join-Path $PWD 'artifacts/payload'
          $out = Join-Path $PWD 'artifacts/release'
          dotnet publish Sputnik.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -o $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-Archive -Path "$payload/*" -DestinationPath "$out/Sputnik-win-x64.zip"
          & ./installer/Prepare-Payload.ps1 -PublishDir $payload
          & $compiler.FullName "/DAppVersion=$env:APP_VERSION" "/DVersionedOutput" "/DPublishDir=$payload" "/DInstallerOutput=$out" installer/Sputnik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath "$out/SputnikSetup-$env:APP_VERSION-win10-win11-x64.exe"
      - name: Upload preview installer and portable build
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: Sputnik-Windows-${{ inputs.version }}-preview
          path: |
            artifacts/release/SputnikSetup-*-win10-win11-x64.exe
            artifacts/release/Sputnik-win-x64.zip
          if-no-files-found: error
          compression-level: 0
      - name: Publish release
        if: inputs.publish
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $notes = 'Офлайн-установщик и переносимая сборка для Windows 10/11 x64. В библиотеку добавлен «Песчаный дозорный (чёткий контур)» с пятью зеркальными анимациями. .NET входит в сборку. Все окна Windows работают на WPF. Повторная установка обновляет существующую копию. Логи находятся в %LOCALAPPDATA%\Sputnik.Desktop\logs.'
          $repo = $env:GITHUB_REPOSITORY
          $drafts = gh api "repos/$repo/releases" | ConvertFrom-Json
          $draft = $drafts | Where-Object { $_.draft -and $_.name -eq "Спутник $tag" } | Select-Object -First 1
          if ($draft) {
            gh api "repos/$repo/releases/$($draft.id)" --method PATCH -f tag_name=$tag -f target_commitish=$env:GITHUB_SHA -F draft=false
          } else {
            gh release view $tag --repo $repo 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Спутник $tag" --notes $notes
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag "artifacts/release/SputnikSetup-$env:APP_VERSION-win10-win11-x64.exe" artifacts/release/Sputnik-win-x64.zip --clobber --repo $repo
          exit $LASTEXITCODE
