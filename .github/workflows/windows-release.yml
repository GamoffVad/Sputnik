name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build distribution and installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a version such as 1.2.0.' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe","$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found.' }
          $payload = Join-Path $PWD 'artifacts/payload'
          $out = Join-Path $PWD 'artifacts/release'
          dotnet publish Sputnik.csproj -c Release -r win-x64 --self-contained false -o $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force $out | Out-Null
          & $compiler.FullName "/DAppVersion=$env:APP_VERSION" "/DPublishDir=$payload" "/DInstallerOutput=$out" installer/Sputnik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$payload/*" -DestinationPath "$out/Sputnik-win-x64.zip"
          Get-FileHash -LiteralPath "$out/SputnikSetup.exe"
      - name: Publish release
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $notes = 'Установщик для Windows x64. В сборку входят HUDI, Кудряшка и Клякса с восемью анимациями. Нужны .NET Desktop Runtime 10 x64 и Microsoft Edge WebView2 Runtime.'
          $repo = $env:GITHUB_REPOSITORY
          $drafts = gh api "repos/$repo/releases" | ConvertFrom-Json
          $draft = $drafts | Where-Object { $_.draft -and $_.name -eq "Спутник $tag" } | Select-Object -First 1
          if ($draft) {
            gh api "repos/$repo/releases/$($draft.id)" --method PATCH -f tag_name=$tag -f target_commitish=$env:GITHUB_SHA -F draft=false
          } else {
            gh release view $tag --repo $repo 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Спутник $tag" --notes $notes
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag artifacts/release/SputnikSetup.exe artifacts/release/Sputnik-win-x64.zip --clobber --repo $repo
          exit $LASTEXITCODE
